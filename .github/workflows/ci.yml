name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16 # Docker Official Image via Google mirror; Docker Hub and public.ecr.aws rate-limit runner pulls
        env:
          POSTGRES_DB: lorekeep
          POSTGRES_USER: lorekeep
          POSTGRES_PASSWORD: lorekeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lorekeep -d lorekeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lorekeep:lorekeep@localhost:5432/lorekeep
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @game/schema build
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --workspace-concurrency=1 -r test
      - run: pnpm --filter @game/server migrate:up
      - run: pnpm --filter @game/server test:db
      - run: pnpm --filter e2e test
      - run: pnpm -r build
      - run: pnpm --filter @game/server smoke:prod
      - name: Verify lockfile is stable
        run: |
          pnpm install --lockfile-only --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml
      # Firefox/WebKit run in the parallel `browsers` job (same specs, no coverage dropped).
      - run: pnpm --filter @game/web exec playwright install --with-deps chromium
      - run: pnpm --filter @game/web exec playwright test --project=chromium
      # Real server (Room + Postgres + scripted DM, no network) driven by the keyboard-only game screen e2e.
      - run: pnpm --filter @game/web exec playwright test -c playwright.live.config.ts
      # Full Adventure #1 solo lifecycle including browser close and server restart.
      - run: pnpm --filter @game/web exec playwright test -c playwright.adventure.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-debug-test-${{ github.run_attempt }}
          path: |
            **/test-results/**
            !**/test-results/**/trace.zip
            !**/trace.zip
            !**/error-context.md
            !**/*live-state.json
            !**/screenshots/**
            !**/screenshot/**
            !**/videos/**
            !**/video/**
            !**/*.png
            !**/*.jpg
            !**/*.jpeg
            !**/*.webp
            !**/*.gif
            !**/*.mp4
            !**/*.webm
            !**/*.mov
          if-no-files-found: ignore
          retention-days: 7

  # Party browser e2e: real server (Room + Postgres + scripted DM) on the party config, which the
  # `test` job does not run. Opt-in for review; runs the same suite that passes locally 10/10.
  party-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16 # Docker Official Image via Google mirror
        env:
          POSTGRES_DB: lorekeep
          POSTGRES_USER: lorekeep
          POSTGRES_PASSWORD: lorekeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lorekeep -d lorekeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lorekeep:lorekeep@localhost:5432/lorekeep
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @game/schema build
      - run: pnpm --filter @game/rules-engine build
      - run: pnpm --filter @game/server migrate:up
      - run: pnpm --filter @game/web exec playwright install --with-deps chromium
      - run: pnpm --filter @game/web exec playwright test -c playwright.party.config.ts
        env:
          # Shared-runner wall clock includes browser, Vite proxy and runner jitter; locally the budget stays 1000 ms, and the measured value is always logged.
          PARTY_SYNC_BUDGET_MS: 1500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-debug-party-${{ github.run_attempt }}
          path: |
            apps/web/test-results/**
            !apps/web/test-results/**/trace.zip
            !**/trace.zip
            !**/error-context.md
            !apps/web/test-results/**/party-live-state.json
            !apps/web/test-results/**/late-join-steps/**
            !apps/web/test-results/**/joiner-waiting-states/**
          if-no-files-found: ignore
          # Exclude trace.zip, error-context.md, party-live-state.json, and step screenshots because they can contain sensitive values; retain other debug artifacts for 7 days.
          retention-days: 7

  browsers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @game/schema build
      - run: pnpm --filter @game/rules-engine build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The ~200 gstreamer/media packages WebKit needs can stall on the runner's
      # Azure mirror. Use Ubuntu's canonical HTTPS archive; let apt retry transient
      # fetch errors in one process. Do not wrap install-deps in an in-step retry:
      # timing out pnpm can orphan apt-get with dpkg's lock held, making a retry
      # self-block.
      - name: Install Firefox and WebKit system dependencies
        timeout-minutes: 12
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt
          grep -qF 'https://archive.ubuntu.com/ubuntu' /etc/apt/apt-mirrors.txt
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' 'DPkg::Lock::Timeout "120";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-retries >/dev/null
          export DEBIAN_FRONTEND=noninteractive
          pnpm --filter @game/web exec playwright install-deps firefox webkit
      - name: Install Firefox and WebKit browsers
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            if timeout 5m pnpm --filter @game/web exec playwright install firefox webkit; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "Playwright browser download failed or timed out; retrying once"
          done
      - run: pnpm --filter @game/web exec playwright test --project=firefox --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-debug-browsers-${{ github.run_attempt }}
          path: |
            **/test-results/**
            !**/test-results/**/trace.zip
            !**/trace.zip
            !**/error-context.md
            !**/*live-state.json
            !**/screenshots/**
            !**/screenshot/**
            !**/videos/**
            !**/video/**
            !**/*.png
            !**/*.jpg
            !**/*.jpeg
            !**/*.webp
            !**/*.gif
            !**/*.mp4
            !**/*.webm
            !**/*.mov
          if-no-files-found: ignore
          retention-days: 7

  llm-recorded:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      LLM_FIXTURE_MODE: strict # replay committed fixtures only; no endpoint, no secrets
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @game/schema build
      - run: pnpm --filter @game/rules-engine build
      - run: pnpm --filter @game/server exec vitest run test/dm test/llm
      - run: pnpm eval:v0

  catalog-reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/catalog-reconcile.mjs

  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/check-assets.test.mjs
      - run: node scripts/check-assets.mjs

  moderation-rubric:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/moderation-rubric.test.mjs

  redteam-recorded:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @game/schema build
      - run: pnpm --filter @game/evals exec vitest run test/redteam.test.ts
      # Offline synthetic recorded fixtures exercise the real row scorers and
      # every M3-41 aggregate threshold.
      - run: pnpm --filter @game/evals exec vitest run redteam/threshold-gate.test.mjs
      - run: pnpm --filter @game/evals exec vitest run redteam/accepted-record-gate.test.mjs
      - run: pnpm --filter @game/server exec vitest run test/safety/hardFloorRedteam.test.ts
      # Always consume the repository-committed binding manifest. Empty or
      # mismatched artifact fields fail closed; no secrets/network are used.
      - run: node packages/evals/redteam/accepted-record-gate.mjs
