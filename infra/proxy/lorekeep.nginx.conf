# Sample only. Replace lorekeep.example, the certificate paths, and the upstream address.
# Pair with TRUST_PROXY=true, HOST=127.0.0.1, PORT=3000. The app port must be reachable only through this proxy.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lorekeep_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name lorekeep.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lorekeep.example;

    ssl_certificate     /etc/letsencrypt/live/lorekeep.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lorekeep.example/privkey.pem;

    client_max_body_size 1m;

    location = /ws {
        proxy_pass http://lorekeep_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://lorekeep_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
