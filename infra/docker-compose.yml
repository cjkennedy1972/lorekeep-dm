services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: lorekeep
      POSTGRES_USER: lorekeep
      POSTGRES_PASSWORD: lorekeep
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorekeep -d lorekeep"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
